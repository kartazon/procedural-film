name: Render film

on:
  workflow_dispatch:
    inputs:
      example:
        description: "Папка примера"
        default: "butterfly-life"
        required: true

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install deps
        working-directory: examples/${{ inputs.example }}/tools
        run: npm install

      - name: Install Chromium
        working-directory: examples/${{ inputs.example }}/tools
        run: npx playwright install --with-deps chromium

      - name: Check
        run: node examples/${{ inputs.example }}/tools/check.cjs

      # TODO: подставить реальную команду рендера MP4 из репозитория
      - name: Render
        run: echo "render command here"

      - uses: actions/upload-artifact@v4
        with:
          name: film-${{ inputs.example }}
          path: |
            examples/${{ inputs.example }}/**/*.mp4
            examples/${{ inputs.example }}/**/*.html
