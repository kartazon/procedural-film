name: Render film

on:
  workflow_dispatch:
    inputs:
      project:
        description: Folder name in examples/
        default: butterfly-life
      workers:
        description: Render workers
        default: '2'
      scale:
        description: Render scale (1 = 1080x1920)
        default: '1'
      crf:
        description: x264 CRF
        default: '16'

jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check project exists
        run: test -d "examples/${{ inputs.project }}/tools"

      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install tool dependencies
        run: npm install --prefix "examples/${{ inputs.project }}/tools"

      - name: Install Chromium
        run: npx --prefix "examples/${{ inputs.project }}/tools" playwright install --with-deps chromium

      - name: Run checks
        run: node "examples/${{ inputs.project }}/tools/check.cjs"

      - name: Render MP4
        run: |
          node "examples/${{ inputs.project }}/tools/render.cjs" \
            --workers "${{ inputs.workers }}" \
            --scale "${{ inputs.scale }}" \
            --crf "${{ inputs.crf }}"

      - name: Upload MP4
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.project }}-mp4
          path: examples/${{ inputs.project }}/exports/*.mp4
          if-no-files-found: error
          retention-days: 7
